# Local development services.
#
#   cp infrastructure/docker/.env.example infrastructure/docker/.env   # then set a local password
#   docker compose -f infrastructure/docker/compose.yaml up -d
#
# Compose reads infrastructure/docker/.env automatically (it sits next to this file).
name: intelligent-cbt

services:
  postgres:
    # PostgreSQL 17 with the pgvector extension available, which semantic retrieval needs from Phase 4.
    # Keep this tag in sync with the PostgreSQL job in .github/workflows/backend-api.yml.
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cbt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/docker/.env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-cbt}
    ports:
      # Only reachable from this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the data volume is first created.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
