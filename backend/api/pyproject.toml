[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-cbt-api"
version = "0.1.0"
description = "API for the source-grounded Intelligent CBT Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "argon2-cffi>=23.1,<26",
  # Learning materials (ADR 0004): uploads, PDF and Word text.
  "python-multipart>=0.0.9,<1.0",
  "pypdfium2>=4.30,<6",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule selection so results do not change when ruff's defaults change.
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "ASYNC", "DTZ"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be used as argument defaults.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Security",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.File",
  "fastapi.Form",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
