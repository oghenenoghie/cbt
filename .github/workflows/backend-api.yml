name: Backend API

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and migrations (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version (pyproject requires-python) and a current release.
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend/api

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Check migrations
        env:
          DATABASE_URL: sqlite:///./ci-migrations.db
        run: |
          alembic upgrade head
          # Fails if the models have changes that no migration covers.
          alembic check
          alembic downgrade base
          alembic upgrade head

  postgres:
    name: Tests and migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as infrastructure/docker/compose.yaml.
        image: pgvector/pgvector:0.8.0-pg17
        env:
          # Throwaway credentials for an ephemeral CI container that holds no real data.
          POSTGRES_USER: cbt
          POSTGRES_PASSWORD: cbt-ci-only
          POSTGRES_DB: cbt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cbt -d cbt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/api

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+psycopg://cbt:cbt-ci-only@localhost:5432/cbt_test
        run: pytest

      - name: Check migrations
        # Runs after the tests, which drop every table they create, so it starts from an empty database.
        env:
          DATABASE_URL: postgresql+psycopg://cbt:cbt-ci-only@localhost:5432/cbt_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
